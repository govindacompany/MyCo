<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>సూపర్ మార్ట్</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #f7fafc; padding-bottom: 40px; }
    header { background: #128c7e; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
    .cart-btn { background: #25d366; color: white; border: none; padding: 6px 14px; border-radius: 15px; font-weight: bold; cursor: pointer; }
    .container { padding: 10px; max-width: 800px; margin: auto; }
    .search-box input { width: 100%; padding: 10px; border-radius: 20px; border: 1px solid #ccc; margin-bottom: 10px; outline: none; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .card { background: white; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; text-align: center; }
    .card h3 { font-size: 13px; margin: 6px 0; height: 32px; overflow: hidden; }
    .card .price { font-weight: bold; color: #128c7e; margin-bottom: 6px; }
    .add-btn { background: #128c7e; color: white; border: none; padding: 6px 10px; border-radius: 4px; width: 100%; font-weight: bold; cursor: pointer; }
    .cart-box { background: white; border: 2px solid #128c7e; border-radius: 8px; padding: 12px; margin-top: 20px; display: none; }
    .form-group { margin: 8px 0; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .order-btn { background: #25d366; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h2>🛒 సూపర్ మార్ట్</h2>
    <button class="cart-btn" onclick="showCart()">కార్ట్ (<span id="cart-cnt">0</span>)</button>
  </header>

  <div class="container">
    <div class="search-box">
      <input type="text" id="srch" placeholder="🔍 సరుకు పేరు వెతకండి (Rice, Oil, Soap...)" onkeyup="filterItems()">
    </div>
    
    <div class="grid" id="grid"></div>

    <div class="cart-box" id="cartBox">
      <h3>ఆర్డర్ & డెలివరీ వివరాలు</h3>
      <div id="cartItems" style="margin: 10px 0; font-size: 14px;"></div>
      <div style="font-weight: bold; margin: 10px 0;">మొత్తం బిల్లు: ₹<span id="totalPrice">0</span></div>
      
      <div class="form-group"><input type="text" id="cname" placeholder="మీ పేరు"></div>
      <div class="form-group"><input type="tel" id="cphone" placeholder="ఫోన్ నంబర్"></div>
      <div class="form-group"><textarea id="caddr" placeholder="డెలివరీ అడ్రస్"></textarea></div>
      <div class="form-group">
        <select id="pmode">
          <option value="UPI / QR Code">UPI ఆన్‌లైన్ పేమెంట్ (GPay/PhonePe)</option>
          <option value="Cash on Delivery">క్యాష్ ఆన్ డెలివరీ (Cash on Delivery)</option>
        </select>
      </div>
      <button class="order-btn" onclick="sendOrder()">📲 WhatsApp లో ఆర్డర్ చేయండి</button>
    </div>
  </div>

  <script>
    const waNumber = "919553354623";
    const items = [
      "సోనా మసూరి బియ్యం 25kg", "బాస్మతి బియ్యం 1kg", "కందిపప్పు 1kg", "మినప గుళ్ళు 1kg", "పెసరపప్పు 1kg", 
      "శనగపప్పు 1kg", "గోధుమ పిండి 10kg", "మైదా పిండి 1kg", "బొంబాయి రవ్వ 1kg", "ఇడ్లీ రవ్వ 1kg", 
      "ఫ్రీడమ్ సన్‌ఫ్లవర్ ఆయిల్ 5L", "వేరుశనగ నూనె 1L", "ఆవు నెయ్యి 500ml", "టాటా ఉప్పు 1kg", "పంచదార 5kg", 
      "బెల్లం 1kg", "కారం పొడి 500g", "పసుపు 250g", "జీలకర్ర 200g", "ఆవాలు 200g", "మెంతులు 200g", 
      "ధనియాల పొడి 250g", "గరం మసాలా 100g", "లవంగాలు 50g", "యాలకులు 50g", "సంతూర్ సోప్ 4-pack", 
      "డెట్టాల్ సోప్ 4-pack", "లక్స్ సోప్ 4-pack", "డవ్ సోప్ 3-pack", "మైసూర్ శాండల్ సోప్", 
      "హెడ్ & షోల్డర్స్ షాంపూ", "క్లినిక్ ప్లస్ షాంపూ", "పారాచూట్ నూనె 500ml", "ఫాగ్ పెర్ఫ్యూమ్", "వైల్డ్ స్టోన్ డియో", 
      "కోల్‌గేట్ పేస్ట్", "క్లోజ్-అప్ పేస్ట్", "బ్రష్‌లు 4-pack", "సర్ఫ్ ఎక్సెల్ 2kg", "ఏరియల్ పౌడర్ 2kg", 
      "రిన్ సోపులు 4-pack", "విమ్ బార్ 3-pack", "హార్పిక్ టాయిలెట్ క్లీనర్ 1L", "లైజాల్ ఫ్లోర్ క్లీనర్ 1L", 
      "ఆల్ అవుట్ రీఫిల్ 2-pack", "సైకిల్ అగర్‌బత్తీలు", "కర్పూరం 100g", "పూజ నూనె 1L", "రెడ్ లేబుల్ టీ 250g", "హార్లిక్స్ 500g"
    ];

    const prods = [];
    for(let i=0; i<500; i++) {
      let base = items[i % items.length];
      let pno = Math.floor(i / items.length) + 1;
      prods.push({ id: i+1, name: pno > 1 ? base + " (Pack " + pno + ")" : base, price: 40 + (i % 20) * 25 });
    }

    let cart = [];
    function render(list) {
      document.getElementById('grid').innerHTML = list.map(p => `
        <div class="card">
          <h3>${p.name}</h3>
          <div class="price">₹${p.price}</div>
          <button class="add-btn" onclick="add(${p.id})">+ జోడించు</button>
        </div>
      `).join('');
    }

    function add(id) {
      let p = prods.find(x => x.id === id);
      cart.push(p);
      document.getElementById('cart-cnt').innerText = cart.length;
      alert(p.name + " కార్ట్‌కు చేర్చబడింది!");
    }

    function filterItems() {
      let val = document.getElementById('srch').value.toLowerCase();
      render(prods.filter(p => p.name.toLowerCase().includes(val)));
    }

    function showCart() {
      if(!cart.length) { alert("కార్ట్ ఖాళీగా ఉంది!"); return; }
      let box = document.getElementById('cartBox');
      box.style.display = 'block';
      let total = cart.reduce((s, x) => s + x.price, 0);
      document.getElementById('totalPrice').innerText = total;
      document.getElementById('cartItems').innerHTML = cart.map(x => `<div>• ${x.name} - ₹${x.price}</div>`).join('');
      box.scrollIntoView({ behavior: 'smooth' });
    }

    function sendOrder() {
      let name = document.getElementById('cname').value;
      let phone = document.getElementById('cphone').value;
      let addr = document.getElementById('caddr').value;
      let mode = document.getElementById('pmode').value;
      if(!name || !phone || !addr) { alert("అన్ని వివరాలు నమోదు చేయండి!"); return; }
      let total = document.getElementById('totalPrice').innerText;
      let list = cart.map((x, i) => `${i+1}. ${x.name} - ₹${x.price}`).join('\n');
      let msg = `🛍️ *కొత్త ఆర్డర్ (సూపర్ మార్ట్)*\n👤 పేరు: ${name}\n📞 ఫోన్: ${phone}\n📍 అడ్రస్: ${addr}\n💳 పేమెంట్: ${mode}\n\n🛒 *వస్తువులు:*\n${list}\n\n💰 *మొత్తం: ₹${total}*`;
      window.open(`https://wa.me/${waNumber}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    render(prods);
  </script>
</body>
</html>
