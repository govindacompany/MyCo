      { name: "పార్లే-జి బిస్కెట్లు", cat: "Snacks", p: 30, u: "250 g", img: "https://images.unsplash.com/photo-1558961363-fa8fdf82db35?w=200" }
    ];

    // లూప్ ద్వారా సరిగ్గా 500 ఉత్పత్తులను క్షణాల్లో తయారు చేయడం
    const products = [];
    let idCounter = 1;
    while (products.length < 500) {
      coreData.forEach(item => {
        if (products.length < 500) {
          const packNo = Math.floor(products.length / coreData.length) + 1;
          products.push({
            id: idCounter++,
            name: packNo === 1 ? item.name : `${item.name} (సైజు/ప్యాక్ ${packNo})`,
            cat: item.cat,
            price: item.p,
            unit: item.u,
            img: item.img
          });
        }
      });
    }

    let cart = [];
    let currentCategory = "All";

    function renderProducts(items) {
      const grid = document.getElementById("product-grid");
      if (items.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #718096; padding: 30px;">వస్తువు దొరకలేదు.</p>`;
        return;
      }
      grid.innerHTML = items.map(p => `
        <div class="card">
          <img src="${p.img}" alt="${p.name}" loading="lazy">
          <div>
            <h3>${p.name}</h3>
            <div class="unit">${p.unit}</div>
            <div class="price">₹${p.price}</div>
          </div>
          <button class="add-btn" onclick="addToCart(${p.id})">+ కార్ట్</button>
        </div>
      `).join('');
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterItems();
    }

    function filterItems() {
      const searchVal = document.getElementById("searchInput").value.toLowerCase().trim();
      const filtered = products.filter(p => {
        const matchesCat = (currentCategory === "All" || p.cat === currentCategory);
        const matchesSearch = p.name.toLowerCase().includes(searchVal);
        return matchesCat && matchesSearch;
      });
      renderProducts(filtered);
    }

    function addToCart(id) {
      const prod = products.find(p => p.id === id);
      const item = cart.find(i => i.id === id);
      if (item) item.qty += 1;
      else cart.push({ ...prod, qty: 1 });
      updateCart();
    }

    function removeFromCart(id) {
      const item = cart.find(i => i.id === id);
      if (item) {
        item.qty -= 1;
        if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
      }
      updateCart();
    }

    function updateCart() {
      const totalItems = cart.reduce((sum, i) => sum + i.qty, 0);
      const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      document.getElementById("cart-count").innerText = totalItems;
      document.getElementById("cart-total").innerText = `₹${totalPrice}`;

      if (cart.length === 0) {
        document.getElementById("cart-items").innerHTML = '<p style="text-align: center; color: #a0aec0; margin-top: 40px;">కార్ట్ ఖాళీగా ఉంది.</p>';
        return;
      }
      document.getElementById("cart-items").innerHTML = cart.map(item => `
        <div class="cart-item">
          <div><strong>${item.name}</strong><br><small>₹${item.price} x ${item.qty}</small></div>
          <div>
            <span style="font-weight:bold;">₹${item.price * item.qty}</span>
            <button onclick="removeFromCart(${item.id})" style="margin-left:6px; background:#e53e3e; color:white; border:none; padding:2px 7px; border-radius:4px; cursor:pointer;">-</button>
          </div>
        </div>
      `).join('');
    }

    function toggleCart() { document.getElementById("cartDrawer").classList.toggle("open"); }

    function togglePaymentSection() {
      const opt = document.getElementById("payOption").value;
      document.getElementById("upi-container").style.display = opt === "UPI" ? "block" : "none";
      document.getElementById("card-container").style.display = opt === "CARD" ? "block" : "none";
      document.getElementById("cod-info-box").style.display = opt === "COD" ? "block" : "none";
    }

    function openCheckout() {
      if (cart.length === 0) { alert("ముందుగా కొన్ని వస్తువులను కార్ట్‌లో జోడించండి!"); return; }
      const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      document.getElementById("pay-total-amount").innerText = `₹${total}`;
      document.getElementById("card-total-amount").innerText = `₹${total}`;

      const upiUrl = `upi://pay?pa=${storeUPI}&pn=${encodeURIComponent(storeName)}&am=${total}&cu=INR&tn=Order%20Payment`;
      document.getElementById("upi-direct-link").setAttribute("href", upiUrl);
      document.getElementById("upi-qr").setAttribute("src", `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(upiUrl)}`);

      togglePaymentSection();
      toggleCart();
      document.getElementById("checkoutModal").classList.add("active");
    }

    function closeCheckout() { document.getElementById("checkoutModal").classList.remove("active"); }

    function sendWhatsAppOrder() {
      const name = document.getElementById("custName").value.trim();
      const phone = document.getElementById("custPhone").value.trim();
      const address = document.getElementById("custAddress").value.trim();
      const opt = document.getElementById("payOption").value;
      const txn = document.getElementById("txnId").value.trim();
      const cardTxn = document.getElementById("cardTxnId").value.trim();

      if (!name || !phone || !address) {
        alert("దయచేసి పేరు, ఫోన్ నంబర్ మరియు అడ్రస్ నమోదు చేయండి.");
        return;
      }

      let payStatus = "";
      if (opt === "UPI") {
        if (!txn || txn.length < 8) {
          alert("⚠️ దయచేసి UPI పేమెంట్ పూర్తి చేసి, 12 అంకెల UTR నంబర్ ఎంటర్ చేయండి!");
          return;
        }
        payStatus = `💳 *పేమెంట్:* ఆన్‌లైన్ UPI (PAID ✅)\n🔢 *UTR No:* ${txn}`;
      } else if (opt === "CARD") {
        if (!cardTxn || cardTxn.length < 5) {
          alert("⚠️ దయచేసి కార్డ్ పేమెంట్ Payment ID నమోదు చేయండి!");
          return;
        }
        payStatus = `💳 *పేమెంట్:* క్రెడిట్/డెబిట్ కార్డ్ (PAID ✅)\n🔢 *Payment ID:* ${cardTxn}`;
      } else {
        payStatus = `💵 *పేమెంట్:* క్యాష్ ఆన్ డెలివరీ (Cash on Delivery)`;
      }

      let orderText = "";
      let total = 0;
      cart.forEach((item, i) => {
        const itemTotal = item.price * item.qty;
        total += itemTotal;
        orderText += `${i+1}. ${item.name} (${item.unit}) x ${item.qty} = ₹${itemTotal}\n`;
      });

      const message = `🛍️ *కొత్త ఆర్డర్ (Mega Mart)*\n-----------------------------\n👤 *పేరు:* ${name}\n📞 *ఫోన్:* ${phone}\n📍 *అడ్రస్:* ${address}\n-----------------------------\n${payStatus}\n-----------------------------\n🛒 *వస్తువులు:*\n${orderText}-----------------------------\n💰 *మొత్తం బిల్లు: ₹${total}*`;
      window.open(`https://wa.me/${storeWhatsAppNumber}?text=${encodeURIComponent(message)}`, "_blank");
      cart = [];
      updateCart();
      closeCheckout();
    }

    renderProducts(products);
  </script>
</body>
</html>
