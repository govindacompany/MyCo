<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>డైలీ ఫ్రెష్ మార్ట్ - WhatsApp ఆర్డరింగ్</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #f7fafc; color: #2d3748; }
    header { background-color: #128c7e; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    header h1 { font-size: 18px; font-weight: 700; }
    .cart-btn { background: #25d366; color: white; border: none; padding: 8px 14px; border-radius: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 14px; }
    .container { max-width: 1100px; margin: 15px auto; padding: 0 12px; }
    .filters { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
    .filter-btn { background: white; border: 1px solid #cbd5e0; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap; }
    .filter-btn.active { background: #128c7e; color: white; border-color: #128c7e; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .card { background: white; border-radius: 8px; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
    .card img { width: 100%; height: 110px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; }
    .card h3 { font-size: 14px; margin-bottom: 4px; }
    .card .unit { color: #718096; font-size: 12px; margin-bottom: 6px; }
    .card .price { font-size: 15px; font-weight: bold; color: #2d3748; margin-bottom: 8px; }
    .add-btn { background-color: #128c7e; color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; font-weight: 600; width: 100%; font-size: 13px; }
    .cart-drawer { position: fixed; right: -100%; top: 0; width: 100%; max-width: 360px; height: 100%; background: white; box-shadow: -4px 0 15px rgba(0,0,0,0.15); transition: right 0.3s ease; z-index: 200; display: flex; flex-direction: column; }
    .cart-drawer.open { right: 0; }
    .cart-header { padding: 15px; background: #128c7e; color: white; display: flex; justify-content: space-between; align-items: center; }
    .close-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
    .cart-items { flex: 1; overflow-y: auto; padding: 15px; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #edf2f7; padding-bottom: 8px; }
    .cart-footer { padding: 15px; border-top: 1px solid #e2e8f0; background: #f8fafc; }
    .total-row { display: flex; justify-content: space-between; font-size: 16px; font-weight: bold; margin-bottom: 12px; }
    .checkout-btn { width: 100%; background: #25d366; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 300; justify-content: center; align-items: center; }
    .modal.active { display: flex; }
    .modal-content { background: white; padding: 20px; border-radius: 10px; width: 92%; max-width: 400px; }
    .modal-content h2 { margin-bottom: 10px; font-size: 17px; color: #128c7e; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 12px; margin-bottom: 4px; font-weight: 600; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 5px; font-size: 13px; }
    .upi-box { background: #e6fffa; border: 1px dashed #38b2ac; padding: 8px; border-radius: 6px; margin-bottom: 10px; font-size: 12px; text-align: center; }
    .whatsapp-submit-btn { background: #25d366; color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; font-size: 15px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>🛒 మై స్టోర్ (My Mart)</h1>
    <button class="cart-btn" onclick="toggleCart()">🛒 కార్ట్ (<span id="cart-count">0</span>)</button>
  </header>

  <div class="container">
    <div class="filters">
      <button class="filter-btn active" onclick="filterCategory('All')">అన్నీ (All)</button>
      <button class="filter-btn" onclick="filterCategory('Grains & Dals')">పప్పులు & బియ్యం</button>
      <button class="filter-btn" onclick="filterCategory('Oils & Spices')">నూనెలు & మసాలాలు</button>
      <button class="filter-btn" onclick="filterCategory('Dairy')">పాల ఉత్పత్తులు</button>
      <button class="filter-btn" onclick="filterCategory('Snacks')">స్నాక్స్ & టీ</button>
    </div>
    <div class="grid" id="product-grid"></div>
  </div>

  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h3>మీ కార్ట్ (Cart)</h3>
      <button class="close-btn" onclick="toggleCart()">&times;</button>
    </div>
    <div class="cart-items" id="cart-items">
      <p style="text-align: center; color: #a0aec0; margin-top: 40px;">కార్ట్ ఖాళీగా ఉంది.</p>
    </div>
    <div class="cart-footer">
      <div class="total-row">
        <span>మొత్తం బిల్లు:</span>
        <span id="cart-total">₹0</span>
      </div>
      <button class="checkout-btn" onclick="openCheckout()">ఆర్డర్ వివరాలు నమోదు చేయండి</button>
    </div>
  </div>

  <div class="modal" id="checkoutModal">
    <div class="modal-content">
      <h2>ఆర్డర్ & డెలివరీ వివరాలు</h2>
      <div class="upi-box">
        💡 <strong>ఆన్‌లైన్ పేమెంట్ UPI ID:</strong><br>
        <span style="font-weight: bold; color: #128c7e;" id="display-upi">9553354623@ybl</span>
      </div>
      <div class="form-group">
        <label>మీ పేరు:</label>
        <input type="text" id="custName" placeholder="ఉదా: రాము">
      </div>
      <div class="form-group">
        <label>మొబైల్ నంబర్:</label>
        <input type="tel" id="custPhone" placeholder="ఉదా: 9876543210">
      </div>
      <div class="form-group">
        <label>పూర్తి డెలివరీ అడ్రస్:</label>
        <textarea id="custAddress" rows="2" placeholder="ఇంటి నెం, వీధి, ఏరియా..."></textarea>
      </div>
      <div class="form-group">
        <label>చెల్లింపు విధానం (Payment):</label>
        <select id="payOption">
          <option value="UPI Online (GPay/PhonePe)">GPay / PhonePe ఆన్‌లైన్ పేమెంట్</option>
          <option value="Cash on Delivery (COD)">క్యాష్ ఆన్ డెలివరీ (Cash on Delivery)</option>
        </select>
      </div>
      <button class="whatsapp-submit-btn" onclick="sendWhatsAppOrder()">📲 WhatsApp లో ఆర్డర్ పంపండి</button>
      <button style="width: 100%; margin-top: 10px; background: none; border: none; color: #718096; cursor: pointer;" onclick="closeCheckout()">రద్దు చేయండి</button>
    </div>
  </div>

  <script>
    const storeWhatsAppNumber = "919553354623";
    const storeUPI = "9553354623@ybl";

    const products = [
      { id: 1, name: "సోనా మసూరి బియ్యం", cat: "Grains & Dals", price: 650, unit: "10 kg", img: "https://images.unsplash.com/photo-1586201375761-83865001e31c?w=300" },
      { id: 2, name: "కందిపప్పు (Toor Dal)", cat: "Grains & Dals", price: 160, unit: "1 kg", img: "https://images.unsplash.com/photo-1596040033229-a9821ebd058d?w=300" },
      { id: 3, name: "సన్‌ఫ్లవర్ ఆయిల్", cat: "Oils & Spices", price: 135, unit: "1 Litre", img: "https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=300" },
      { id: 4, name: "ఆశీర్వాద్ గోధుమ పిండి", cat: "Grains & Dals", price: 245, unit: "5 kg", img: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=300" },
      { id: 5, name: "తాజా పాలు (Milk)", cat: "Dairy", price: 34, unit: "500 ml", img: "https://images.unsplash.com/photo-1550583724-b2692b85b150?w=300" },
      { id: 6, name: "స్వచ్ఛమైన నెయ్యి (Ghee)", cat: "Dairy", price: 330, unit: "500 ml", img: "https://images.unsplash.com/photo-1627483262268-9c2b5b2834b5?w=300" },
      { id: 7, name: "టీ పొడి (Tea)", cat: "Snacks", price: 140, unit: "250 g", img: "https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=300" },
      { id: 8, name: "బిస్కెట్స్ (Biscuits)", cat: "Snacks", price: 30, unit: "1 Pack", img: "https://images.unsplash.com/photo-1558961363-fa8fdf82db35?w=300" }
    ];

    let cart = [];

    function renderProducts(items) {
      document.getElementById("product-grid").innerHTML = items.map(p => `
        <div class="card">
          <img src="${p.img}" alt="${p.name}">
          <div>
            <h3>${p.name}</h3>
            <div class="unit">${p.unit}</div>
            <div class="price">₹${p.price}</div>
          </div>
          <button class="add-btn" onclick="addToCart(${p.id})">+ కార్ట్‌కు జోడించు</button>
        </div>
      `).join('');
    }

    function filterCategory(cat) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      if (cat === 'All') renderProducts(products);
      else renderProducts(products.filter(p => p.cat === cat));
    }

    function addToCart(id) {
      const prod = products.find(p => p.id === id);
      const item = cart.find(i => i.id === id);
      if (item) item.qty += 1;
      else cart.push({ ...prod, qty: 1 });
      updateCart();
    }

    function removeFromCart(id) {
      const item = cart.find(i => i.id === id);
      if (item) {
        item.qty -= 1;
        if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
      }
      updateCart();
    }

    function updateCart() {
      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      document.getElementById("cart-count").innerText = totalItems;
      document.getElementById("cart-total").innerText = `₹${totalPrice}`;

      if (cart.length === 0) {
        document.getElementById("cart-items").innerHTML = '<p style="text-align: center; color: #a0aec0; margin-top: 40px;">కార్ట్ ఖాళీగా ఉంది.</p>';
        return;
      }

      document.getElementById("cart-items").innerHTML = cart.map(item => `
        <div class="cart-item">
          <div>
            <strong>${item.name}</strong><br>
            <small>₹${item.price} x ${item.qty}</small>
          </div>
          <div>
            <span style="font-weight: bold;">₹${item.price * item.qty}</span>
            <button onclick="removeFromCart(${item.id})" style="margin-left: 6px; background: #e53e3e; color: white; border: none; padding: 2px 7px; border-radius: 4px; cursor: pointer;">-</button>
          </div>
        </div>
      `).join('');
    }

    function toggleCart() { document.getElementById("cartDrawer").classList.toggle("open"); }
    function openCheckout() {
      if (cart.length === 0) { alert("ముందుగా కొన్ని వస్తువులను కార్ట్‌లో జోడించండి!"); return; }
      toggleCart();
      document.getElementById("checkoutModal").classList.add("active");
    }
    function closeCheckout() { document.getElementById("checkoutModal").classList.remove("active"); }

    function sendWhatsAppOrder() {
      const name = document.getElementById("custName").value.trim();
      const phone = document.getElementById("custPhone").value.trim();
      const address = document.getElementById("custAddress").value.trim();
      const payOption = document.getElementById("payOption").value;

      if (!name || !phone || !address) {
        alert("దయచేసి పేరు, ఫోన్ నంబర్ మరియు అడ్రస్ నమోదు చేయండి.");
        return;
      }

      let orderText = "";
      let total = 0;
      cart.forEach((item, i) => {
        const itemTotal = item.price * item.qty;
        total += itemTotal;
        orderText += `${i+1}. ${item.name} (${item.unit}) x ${item.qty} = ₹${itemTotal}\n`;
      });

      const message = `🛍️ *కొత్త ఆర్డర్ (My Mart)*\n-----------------------------\n👤 *పేరు:* ${name}\n📞 *ఫోన్:* ${phone}\n📍 *అడ్రస్:* ${address}\n💳 *పేమెంట్:* ${payOption}\n-----------------------------\n🛒 *వస్తువులు:*\n${orderText}-----------------------------\n💰 *మొత్తం బిల్లు: ₹${total}*`;
      window.open(`https://wa.me/${storeWhatsAppNumber}?text=${encodeURIComponent(message)}`, "_blank");
      cart = [];
      updateCart();
      closeCheckout();
    }

    renderProducts(products);
  </script>
</body>
</html>
